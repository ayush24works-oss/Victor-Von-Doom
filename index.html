<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WhatsApp</title>
  <meta name="description" content="Chat with fictional characters in a familiar WhatsApp interface." />
  <style>
    :root {
      --bg-outer: #080d10;
      --bg-app: #0b141a;
      --bg-header: #202c33;
      --bg-surface: #111b21;
      --bg-input: #2a3942;
      --bg-hover: #182229;
      --bg-incoming: #202c33;
      --bg-outgoing: #005c4b;
      --bg-system: #182229;
      --text-primary: #e9edef;
      --text-secondary: #8696a0;
      --text-system: #ffd279;
      --wa-green: #00a884;
      --wa-green-soft: rgba(0, 168, 132, 0.16);
      --tick-grey: #8696a0;
      --tick-blue: #53bdeb;
      --border-subtle: rgba(134, 150, 160, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--bg-outer);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app-shell {
      width: 100%;
      max-width: 500px;
      height: 100%;
      max-height: 100dvh;
      background-color: var(--bg-app);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.7);
    }

    @media (min-width: 520px) {
      .app-shell {
        height: 94dvh;
        border-radius: 12px;
        border: 1px solid var(--border-subtle);
      }
    }

    .view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-app);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
    }

    .view.hidden-left {
      transform: translateX(-25%);
      opacity: 0;
      pointer-events: none;
    }

    .view.hidden-right {
      transform: translateX(100%);
      opacity: 0;
      pointer-events: none;
    }

    /* ================= WHATSAPP HOME VIEW ================= */
    .wa-top-header {
      background-color: var(--bg-app);
      padding: 14px 16px 8px 16px;
    }

    .wa-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .wa-brand {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.2px;
    }

    .wa-header-badge {
      font-size: 11px;
      color: var(--wa-green);
      background: var(--wa-green-soft);
      padding: 3px 9px;
      border-radius: 12px;
      font-weight: 600;
    }

    .wa-search-box {
      background-color: var(--bg-header);
      border-radius: 22px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .wa-search-box svg {
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .wa-search-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 14px;
    }

    .wa-search-box input::placeholder {
      color: var(--text-secondary);
    }

    .wa-filters {
      display: flex;
      gap: 8px;
      padding: 10px 16px 8px 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .wa-filters::-webkit-scrollbar {
      display: none;
    }

    .wa-pill {
      background-color: var(--bg-header);
      color: var(--text-secondary);
      border: none;
      padding: 6px 14px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s, color 0.15s;
    }

    .wa-pill.active {
      background-color: var(--wa-green-soft);
      color: var(--wa-green);
      font-weight: 600;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 12px;
    }

    .chat-row {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 11px 16px;
      cursor: pointer;
      transition: background-color 0.14s ease;
    }

    .chat-row:hover, .chat-row:active {
      background-color: var(--bg-hover);
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--bg-header);
    }

    .avatar svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .chat-row-body {
      flex: 1;
      min-width: 0;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .chat-row:last-child .chat-row-body {
      border-bottom: none;
    }

    .chat-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }

    .chat-row-name {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .verified-badge {
      width: 15px;
      height: 15px;
      fill: var(--wa-green);
      flex-shrink: 0;
    }

    .chat-row-time {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .chat-row-time.unread {
      color: var(--wa-green);
      font-weight: 600;
    }

    .chat-row-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .chat-row-preview {
      font-size: 14px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unread-badge {
      background-color: var(--wa-green);
      color: #0b141a;
      font-size: 11.5px;
      font-weight: 700;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .pin-label {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .wa-bottom-nav {
      background-color: var(--bg-app);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-around;
      padding: 8px 0 10px 0;
    }

    .wa-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    .wa-nav-item.active {
      color: var(--text-primary);
    }

    .wa-nav-pill {
      padding: 4px 18px;
      border-radius: 16px;
    }

    .wa-nav-item.active .wa-nav-pill {
      background-color: var(--wa-green-soft);
      color: var(--wa-green);
    }

    /* ================= WHATSAPP CHAT VIEW ================= */
    .chat-wallpaper {
      position: absolute;
      inset: 0;
      opacity: 0.055;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23e9edef' stroke-width='1.5'%3E%3Cpath d='M15 15h10v10H15zM55 15l7 10H48zM20 55a6 6 0 1 0 0.001 0zM52 52l12 12M64 52L52 64M38 35l4-7 4 7-4 7z'/%3E%3C/g%3E%3C/svg%3E");
      background-size: 90px 90px;
      z-index: 0;
    }

    .chat-header {
      background-color: var(--bg-header);
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      z-index: 10;
      min-height: 62px;
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-contact-trigger {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      min-width: 0;
    }

    .chat-contact-trigger .avatar {
      width: 40px;
      height: 40px;
    }

    .chat-contact-name {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .chat-contact-status {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .chat-contact-status.typing {
      color: var(--wa-green);
      font-weight: 500;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 7px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 1;
      scroll-behavior: smooth;
    }

    .date-pill {
      align-self: center;
      background-color: var(--bg-system);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .system-banner {
      align-self: center;
      background-color: var(--bg-system);
      color: var(--text-system);
      font-size: 11.5px;
      line-height: 1.4;
      text-align: center;
      padding: 7px 12px;
      border-radius: 8px;
      max-width: 88%;
      margin-bottom: 10px;
    }

    .message-row {
      display: flex;
      width: 100%;
      animation: msgIn 0.16s ease-out;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.outgoing { justify-content: flex-end; }
    .message-row.incoming { justify-content: flex-start; }

    .bubble {
      position: relative;
      max-width: 82%;
      padding: 7px 10px 7px 11px;
      border-radius: 8px;
      font-size: 14.5px;
      line-height: 1.42;
      word-wrap: break-word;
      box-shadow: 0 1px 1.5px rgba(0, 0, 0, 0.28);
    }

    .incoming .bubble {
      background-color: var(--bg-incoming);
      border-top-left-radius: 0;
      margin-left: 6px;
    }

    .incoming .bubble::before {
      content: "";
      position: absolute;
      top: 0;
      left: -8px;
      border-top: 10px solid var(--bg-incoming);
      border-left: 8px solid transparent;
    }

    .outgoing .bubble {
      background-color: var(--bg-outgoing);
      border-top-right-radius: 0;
      margin-right: 6px;
    }

    .outgoing .bubble::before {
      content: "";
      position: absolute;
      top: 0;
      right: -8px;
      border-top: 10px solid var(--bg-outgoing);
      border-right: 8px solid transparent;
    }

    .msg-meta {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      float: right;
      margin: 4px 0 -3px 10px;
      font-size: 11px;
      color: rgba(233, 237, 239, 0.65);
    }

    .typing-bubble {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 11px 14px;
    }

    .dot {
      width: 6.5px;
      height: 6.5px;
      background-color: var(--text-secondary);
      border-radius: 50%;
      animation: bounceDot 1.3s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: 0.16s; }
    .dot:nth-child(3) { animation-delay: 0.32s; }

    @keyframes bounceDot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.45; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    .quick-replies {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 6px 12px;
      z-index: 5;
      scrollbar-width: none;
    }
    .quick-replies::-webkit-scrollbar { display: none; }

    .chip {
      background-color: var(--bg-header);
      border: 1px solid rgba(0, 168, 132, 0.35);
      color: #d1d7db;
      font-size: 12.5px;
      padding: 6px 12px;
      border-radius: 16px;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip:hover {
      background-color: var(--bg-outgoing);
      border-color: var(--wa-green);
      color: #fff;
    }

    .input-bar {
      background-color: var(--bg-header);
      padding: 8px 10px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      z-index: 10;
    }

    .input-wrapper {
      flex: 1;
      background-color: var(--bg-input);
      border-radius: 22px;
      padding: 9px 15px;
    }

    #messageInput {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      max-height: 96px;
      line-height: 1.35;
    }

    #messageInput::placeholder { color: var(--text-secondary); }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background-color: var(--wa-green);
      color: #0b141a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .send-btn:active { transform: scale(0.93); }

    /* Contact Info Modal */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }

    .modal-backdrop.open { display: flex; }

    .profile-card {
      background: var(--bg-header);
      width: 100%;
      max-width: 340px;
      border-radius: 14px;
      padding: 22px;
      text-align: center;
      border: 1px solid var(--border-subtle);
    }

    .profile-card .large-avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 12px auto;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--wa-green);
    }

    .profile-card h2 { font-size: 18px; margin-bottom: 4px; }
    .profile-card .subtitle { font-size: 12.5px; color: var(--wa-green); margin-bottom: 14px; }
    .profile-card .bio {
      background: var(--bg-app);
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      color: #d1d7db;
      text-align: left;
      line-height: 1.45;
      margin-bottom: 16px;
    }

    .close-modal-btn {
      background: var(--wa-green);
      color: #0b141a;
      border: none;
      padding: 9px 22px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-shell">

    <!-- ================= VIEW 1: WHATSAPP CHATS HOME ================= -->
    <section class="view" id="homeView">
      <header class="wa-top-header">
        <div class="wa-title-row">
          <h1 class="wa-brand">WhatsApp</h1>
          <span class="wa-header-badge">Characters Hub</span>
        </div>

        <div class="wa-search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Search or start new chat" />
        </div>
      </header>

      <div class="wa-filters" id="filterBar">
        <button class="wa-pill active" data-filter="All">All</button>
        <button class="wa-pill" data-filter="Unread">Unread</button>
        <button class="wa-pill" data-filter="Villains">Villains</button>
        <button class="wa-pill" data-filter="Heroes">Heroes</button>
        <button class="wa-pill" data-filter="Detectives">Detectives</button>
      </div>

      <div class="chat-list" id="chatList"></div>

      <nav class="wa-bottom-nav">
        <div class="wa-nav-item active">
          <div class="wa-nav-pill">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
            </svg>
          </div>
          <span>Chats</span>
        </div>
        <div class="wa-nav-item" id="updatesTabBtn">
          <div class="wa-nav-pill">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
            </svg>
          </div>
          <span>Updates</span>
        </div>
      </nav>
    </section>

    <!-- ================= VIEW 2: WHATSAPP CHAT ROOM ================= -->
    <section class="view hidden-right" id="chatView">
      <div class="chat-wallpaper"></div>

      <header class="chat-header">
        <div class="chat-header-left">
          <button class="back-btn" id="backToHomeBtn" aria-label="Back">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
              <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
            </svg>
          </button>

          <div class="chat-contact-trigger" id="openProfileBtn">
            <div class="avatar" id="chatHeaderAvatar"></div>
            <div>
              <div class="chat-contact-name">
                <span id="chatHeaderName">Victor Von Doom</span>
                <svg class="verified-badge" viewBox="0 0 24 24">
                  <path d="M12 2L14.8 4.4L18.5 4.1L19.6 7.6L22.7 9.6L21.6 13.1L22.7 16.6L19.6 18.6L18.5 22.1L14.8 21.8L12 24.2L9.2 21.8L5.5 22.1L4.4 18.6L1.3 16.6L2.4 13.1L1.3 9.6L4.4 7.6L5.5 4.1L9.2 4.4L12 2ZM10.4 16.3L17.1 9.6L15.7 8.2L10.4 13.5L8.1 11.2L6.7 12.6L10.4 16.3Z"/>
                </svg>
              </div>
              <div class="chat-contact-status" id="chatHeaderStatus">online</div>
            </div>
          </div>
        </div>

        <button class="icon-btn" id="resetChatBtn" title="Reset Chat">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
          </svg>
        </button>
      </header>

      <main class="messages-area" id="messagesArea"></main>

      <div class="quick-replies" id="quickReplies"></div>

      <footer class="input-bar">
        <div class="input-wrapper">
          <textarea id="messageInput" rows="1" placeholder="Message"></textarea>
        </div>
        <button class="send-btn" id="sendBtn" aria-label="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </footer>
    </section>

    <!-- Contact Info Modal -->
    <div class="modal-backdrop" id="profileModal">
      <div class="profile-card">
        <div class="large-avatar" id="modalAvatar"></div>
        <h2 id="modalName">Name</h2>
        <div class="subtitle" id="modalHandle">Handle</div>
        <div class="bio" id="modalBio">About</div>
        <button class="close-modal-btn" id="closeModalBtn">Close</button>
      </div>
    </div>

  </div>

  <script>
    const CHARACTERS = [
      {
        id: "doom",
        name: "Victor Von Doom",
        handle: "Monarch of Latveria • +40 000 DOOM",
        category: "Villains",
        pinned: true,
        unread: 1,
        lastTime: "08:08 PM",
        status: "online",
        bio: "All hope lies in Doom. Speak plainly or do not message at all.",
        openingLine: "You have reached the private line of Victor Von Doom. State your business—before I lose interest.",
        chips: [
          { label: "Thoughts on Reed Richards?", msg: "What do you think of Reed Richards?" },
          { label: "Can I visit Latveria?", msg: "Can I visit Latveria?" },
          { label: "Why the mask?", msg: "Why do you wear the iron mask?" },
          { label: "Science or magic?", msg: "Who is stronger: science or magic?" }
        ],
        avatarSVG: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <rect width="100" height="100" fill="#0d261c"/>
          <path d="M12 96 C12 42, 24 12, 50 12 C76 12, 88 42, 88 96 Z" fill="#14532d"/>
          <path d="M22 92 C22 48, 32 22, 50 22 C68 22, 78 48, 78 92 Z" fill="#091a12"/>
          <path d="M31 38 L50 32 L69 38 L66 72 L50 84 L34 72 Z" fill="#9ca3af"/>
          <path d="M50 32 L69 38 L66 72 L50 84 Z" fill="#6b7280"/>
          <polygon points="34,46 47,50 36,52" fill="#111827"/>
          <polygon points="66,46 53,50 64,52" fill="#111827"/>
          <circle cx="41" cy="49.5" r="1.8" fill="#fef08a"/>
          <circle cx="59" cy="49.5" r="1.8" fill="#fef08a"/>
          <rect x="40" y="64" width="20" height="9" rx="2" fill="#374151"/>

      messagesArea.appendChild(row);
