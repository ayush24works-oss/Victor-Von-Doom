<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StarkChat | Stark Industries Encrypted Comms</title>
  <meta name="description" content="Stark Industries Multiverse Messaging Interface. Powered by J.A.R.V.I.S." />
  <style>
    :root {
      /* Stark Industries + WhatsApp Hybrid Palette */
      --bg-outer: #04070d;
      --bg-app: #080d16;
      --bg-header: #0f1726;
      --bg-surface: #131d31;
      --bg-hover: #18253d;
      --bg-incoming: #131d31;
      --bg-outgoing: #0c3b54;
      --bg-system: #0d192b;
      --text-primary: #eef6ff;
      --text-secondary: #7e97b8;
      --arc-cyan: #00d8ff;
      --arc-cyan-dim: rgba(0, 216, 255, 0.16);
      --stark-gold: #f59e0b;
      --tick-grey: #7e97b8;
      --tick-blue: #00d8ff;
      --border-hud: rgba(0, 216, 255, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--bg-outer);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app-shell {
      width: 100%;
      max-width: 500px;
      height: 100%;
      max-height: 100dvh;
      background-color: var(--bg-app);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 50px rgba(0, 216, 255, 0.12), 0 16px 40px rgba(0, 0, 0, 0.8);
    }

    @media (min-width: 520px) {
      .app-shell {
        height: 94dvh;
        border-radius: 16px;
        border: 1px solid var(--border-hud);
      }
    }

    /* Views (Home vs Active Chat) */
    .view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-app);
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s ease;
    }

    .view.hidden-left {
      transform: translateX(-28%);
      opacity: 0;
      pointer-events: none;
    }

    .view.hidden-right {
      transform: translateX(100%);
      opacity: 0;
      pointer-events: none;
    }

    /* ================= HOME VIEW (STARKCHAT) ================= */
    .home-header {
      background-color: var(--bg-header);
      padding: 14px 16px 10px 16px;
      border-bottom: 1px solid var(--border-hud);
    }

    .brand-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .brand-title-group {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .arc-logo {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--arc-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(0, 216, 255, 0.5);
    }

    .arc-logo-core {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--arc-cyan);
      box-shadow: 0 0 8px var(--arc-cyan);
    }

    .brand-name {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--text-primary);
    }

    .brand-name span {
      color: var(--arc-cyan);
    }

    .stark-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--stark-gold);
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 3px 7px;
      border-radius: 6px;
    }

    /* WhatsApp-style Search Bar */
    .search-box {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hud);
      border-radius: 20px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .search-box svg {
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 14px;
    }

    .search-box input::placeholder {
      color: var(--text-secondary);
    }

    /* Filter Chips (All, Unread, Heroes, Villains) */
    .filter-bar {
      display: flex;
      gap: 8px;
      padding: 10px 16px 8px 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-pill {
      background-color: var(--bg-surface);
      color: var(--text-secondary);
      border: 1px solid transparent;
      padding: 6px 13px;
      border-radius: 16px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .filter-pill.active {
      background-color: var(--arc-cyan-dim);
      color: var(--arc-cyan);
      border-color: rgba(0, 216, 255, 0.4);
    }

    /* Chat List */
    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 12px;
    }

    .chat-row {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.15s ease;
      border-bottom: 1px solid rgba(126, 151, 184, 0.06);
    }

    .chat-row:hover, .chat-row:active {
      background-color: var(--bg-hover);
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      border: 1.5px solid rgba(0, 216, 255, 0.45);
      background: var(--bg-surface);
    }

    .avatar svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .chat-row-body {
      flex: 1;
      min-width: 0;
    }

    .chat-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .chat-row-name {
      font-size: 15.5px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .verified-icon {
      width: 15px;
      height: 15px;
      fill: var(--arc-cyan);
      flex-shrink: 0;
    }

    .chat-row-time {
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    .chat-row-time.has-unread {
      color: var(--arc-cyan);
      font-weight: 600;
    }

    .chat-row-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .chat-row-preview {
      font-size: 13.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unread-badge {
      background-color: var(--arc-cyan);
      color: #04101a;
      font-size: 11px;
      font-weight: 700;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .pin-icon {
      color: var(--text-secondary);
      opacity: 0.7;
    }

    /* Bottom Navigation Bar (WhatsApp Style) */
    .bottom-nav {
      background-color: var(--bg-header);
      border-top: 1px solid var(--border-hud);
      display: flex;
      justify-content: space-around;
      padding: 8px 0 10px 0;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--arc-cyan);
    }

    .nav-pill {
      padding: 3px 16px;
      border-radius: 14px;
    }

    .nav-item.active .nav-pill {
      background-color: var(--arc-cyan-dim);
    }

    /* ================= ACTIVE CHAT VIEW ================= */
    .chat-wallpaper {
      position: absolute;
      inset: 0;
      opacity: 0.06;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg width='90' height='90' viewBox='0 0 90 90' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%2300d8ff' stroke-width='1.2'%3E%3Ccircle cx='45' cy='45' r='16'/%3E%3Ccircle cx='45' cy='45' r='6'/%3E%3Cpath d='M45 10v12M45 68v12M10 45h12M68 45h12'/%3E%3C/g%3E%3C/svg%3E");
      background-size: 90px 90px;
      z-index: 0;
    }

    .chat-header {
      background-color: var(--bg-header);
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-hud);
      z-index: 10;
      min-height: 62px;
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--arc-cyan);
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-contact-trigger {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      min-width: 0;
    }

    .chat-contact-trigger .avatar {
      width: 40px;
      height: 40px;
    }

    .chat-contact-name {
      font-size: 15.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .chat-contact-status {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .chat-contact-status.typing {
      color: var(--arc-cyan);
      font-weight: 500;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 7px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background: rgba(0, 216, 255, 0.1);
      color: var(--arc-cyan);
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 1;
      scroll-behavior: smooth;
    }

    .date-pill {
      align-self: center;
      background-color: var(--bg-surface);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .system-banner {
      align-self: center;
      background-color: var(--bg-system);
      border: 1px solid var(--border-hud);
      color: var(--stark-gold);
      font-size: 11.5px;
      line-height: 1.4;
      text-align: center;
      padding: 7px 12px;
      border-radius: 8px;
      max-width: 90%;
      margin-bottom: 10px;
    }

    .message-row {
      display: flex;
      width: 100%;
      animation: msgIn 0.18s ease-out;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.outgoing { justify-content: flex-end; }
    .message-row.incoming { justify-content: flex-start; }

    .bubble {
      position: relative;
      max-width: 82%;
      padding: 8px 11px;
      border-radius: 10px;
      font-size: 14.5px;
      line-height: 1.42;
      word-wrap: break-word;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    .incoming .bubble {
      background-color: var(--bg-incoming);
      border: 1px solid rgba(0, 216, 255, 0.12);
      border-top-left-radius: 0;
      margin-left: 6px;
    }

    .incoming .bubble::before {
      content: "";
      position: absolute;
      top: 0;
      left: -8px;
      border-top: 10px solid var(--bg-incoming);
      border-left: 8px solid transparent;
    }

    .outgoing .bubble {
      background-color: var(--bg-outgoing);
      border: 1px solid rgba(0, 216, 255, 0.25);
      border-top-right-radius: 0;
      margin-right: 6px;
    }

    .outgoing .bubble::before {
      content: "";
      position: absolute;
      top: 0;
      right: -8px;
      border-top: 10px solid var(--bg-outgoing);
      border-right: 8px solid transparent;
    }

    .msg-meta {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      float: right;
      margin: 4px 0 -3px 10px;
      font-size: 10.5px;
      color: rgba(238, 246, 255, 0.65);
    }

    .typing-bubble {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 12px 15px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background-color: var(--arc-cyan);
      border-radius: 50%;
      animation: pulseDot 1.3s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: 0.16s; }
    .dot:nth-child(3) { animation-delay: 0.32s; }

    @keyframes pulseDot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    .quick-replies {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 6px 12px;
      z-index: 5;
      scrollbar-width: none;
    }
    .quick-replies::-webkit-scrollbar { display: none; }

    .chip {
      background-color: var(--bg-surface);
      border: 1px solid rgba(0, 216, 255, 0.32);
      color: var(--text-primary);
      font-size: 12.5px;
      padding: 6px 12px;
      border-radius: 16px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip:hover {
      background-color: var(--bg-outgoing);
      border-color: var(--arc-cyan);
    }

    .input-bar {
      background-color: var(--bg-header);
      padding: 8px 10px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      border-top: 1px solid var(--border-hud);
      z-index: 10;
    }

    .input-wrapper {
      flex: 1;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hud);
      border-radius: 22px;
      padding: 9px 15px;
    }

    #messageInput {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      max-height: 96px;
      line-height: 1.35;
    }

    #messageInput::placeholder { color: var(--text-secondary); }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background-color: var(--arc-cyan);
      color: #04101a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 0 14px rgba(0, 216, 255, 0.4);
    }

    .send-btn:active { transform: scale(0.93); }

    /* Profile Modal */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(4, 7, 13, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }

    .modal-backdrop.open { display: flex; }

    .profile-card {
      background: var(--bg-header);
      border: 1px solid var(--border-hud);
      width: 100%;
      max-width: 340px;
      border-radius: 16px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.75);
    }

    .profile-card .large-avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 12px auto;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--arc-cyan);
    }

    .profile-card h2 { font-size: 18px; margin-bottom: 4px; }
    .profile-card .subtitle { font-size: 12.5px; color: var(--arc-cyan); margin-bottom: 14px; }
    .profile-card .bio {
      background: var(--bg-app);
      border: 1px solid var(--border-hud);
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      color: #cfe3fa;
      text-align: left;
      line-height: 1.45;
      margin-bottom: 16px;
    }

    .close-modal-btn {
      background: var(--arc-cyan);
      color: #04101a;
      border: none;
      padding: 9px 22px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-shell">

    <!-- ==================== VIEW 1: STARKCHAT HOME ==================== -->
    <section class="view" id="homeView">
      <header class="home-header">
        <div class="brand-bar">
          <div class="brand-title-group">
            <div class="arc-logo"><div class="arc-logo-core"></div></div>
            <h1 class="brand-name">Stark<span>Chat</span></h1>
          </div>
          <span class="stark-tag">J.A.R.V.I.S. OS</span>
        </div>

        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Ask J.A.R.V.I.S. or search contacts..." />
        </div>
      </header>

      <div class="filter-bar" id="filterBar">
        <button class="filter-pill active" data-filter="All">All</button>
        <button class="filter-pill" data-filter="Unread">Unread</button>
        <button class="filter-pill" data-filter="Heroes">Heroes</button>
        <button class="filter-pill" data-filter="Villains">Villains</button>
        <button class="filter-pill" data-filter="Detectives">Detectives</button>
      </div>

      <div class="chat-list" id="chatList"></div>

      <nav class="bottom-nav">
        <div class="nav-item active">
          <div class="nav-pill">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
            </svg>
          </div>
          <span>Chats</span>
        </div>
        <div class="nav-item" id="updatesTabBtn">
          <div class="nav-pill">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
          <span>HUD Status</span>
        </div>
      </nav>
    </section>

    <!-- ==================== VIEW 2: ACTIVE CHAT ==================== -->
    <section class="view hidden-right" id="chatView">
      <div class="chat-wallpaper"></div>

      <header class="chat-header">
        <div class="chat-header-left">
          <button class="back-btn" id="backToHomeBtn" aria-label="Back to StarkChat">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
              <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
            </svg>
          </button>

          <div class="chat-contact-trigger" id="openProfileBtn">
            <div class="avatar" id="chatHeaderAvatar"></div>
            <div>
              <div class="chat-contact-name">
                <span id="chatHeaderName">Victor Von Doom</span>
                <svg class="verified-icon" viewBox="0 0 24 24">
                  <path d="M12 2L14.8 4.4L18.5 4.1L19.6 7.6L22.7 9.6L21.6 13.1L22.7 16.6L19.6 18.6L18.5 22.1L14.8 21.8L12 24.2L9.2 21.8L5.5 22.1L4.4 18.6L1.3 16.6L2.4 13.1L1.3 9.6L4.4 7.6L5.5 4.1L9.2 4.4L12 2ZM10.4 16.3L17.1 9.6L15.7 8.2L10.4 13.5L8.1 11.2L6.7 12.6L10.4 16.3Z"/>
                </svg>
              </div>
              <div class="chat-contact-status" id="chatHeaderStatus">online</div>
            </div>
          </div>
        </div>

        <button class="icon-btn" id="resetChatBtn" title="Reset Channel">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
          </svg>
        </button>
      </header>

      <main class="messages-area" id="messagesArea"></main>

      <div class="quick-replies" id="quickReplies"></div>

      <footer class="input-bar">
        <div class="input-wrapper">
          <textarea id="messageInput" rows="1" placeholder="Transmit encrypted message..."></textarea>
        </div>
        <button class="send-btn" id="sendBtn" aria-label="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </footer>
    </section>

    <!-- Contact Dossier Modal -->
    <div class="modal-backdrop" id="profileModal">
      <div class="profile-card">
        <div class="large-avatar" id="modalAvatar"></div>
        <h2 id="modalName">Name</h2>
        <div class="subtitle" id="modalHandle">Handle</div>
        <div class="bio" id="modalBio">Bio</div>
        <button class="close-modal-btn" id="closeModalBtn">Close Dossier</button>
      </div>
    </div>

  </div>

  <!-- Load Character Roster & Scripted Engines -->
  <script src="./characters.js"></script>

  <script>
    const homeView = document.getElementById("homeView");
    const chatView = document.getElementById("chatView");
    const chatListEl = document.getElementById("chatList");
    const searchInput = document.getElementById("searchInput");
    const filterBar = document.getElementById("filterBar");

    const backToHomeBtn = document.getElementById("backToHomeBtn");
    const chatHeaderAvatar = document.getElementById("chatHeaderAvatar");
    const chatHeaderName = document.getElementById("chatHeaderName");
    const chatHeaderStatus = document.getElementById("chatHeaderStatus");
    const messagesArea = document.getElementById("messagesArea");
    const quickReplies = document.getElementById("quickReplies");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const resetChatBtn = document.getElementById("resetChatBtn");

    const profileModal = document.getElementById("profileModal");
    const openProfileBtn = document.getElementById("openProfileBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");

    let activeFilter = "All";
    let searchQuery = "";
    let activeChar = null;
    let isReplying = false;

    // Store separate message histories per character ID
    const chatHistories = {};
    CHARACTERS.forEach((c) => {
      chatHistories[c.id] = [
        { sender: "incoming", text: c.openingLine, time: c.lastTime }
      ];
    });

    function getTimeNow() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function getTickSVG(state) {
      if (state === "sent") {
        return `<svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M11.5 1.5L4.8 8.5L2 5.7" stroke="#7e97b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      }
      const color = state === "read" ? "#00d8ff" : "#7e97b8";
      return `<svg width="18" height="11" viewBox="0 0 18 11" fill="none">
        <path d="M11.5 1.5L4.8 8.5L2 5.7" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15.5 1.5L8.8 8.5L7.3 7" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
    }

    // Render StarkChat Home List
    function renderChatList() {
      const filtered = CHARACTERS.filter((c) => {
        const matchesSearch =
          c.name.toLowerCase().includes(searchQuery) ||
          c.handle.toLowerCase().includes(searchQuery);
        if (!matchesSearch) return false;
        if (activeFilter === "All") return true;
        if (activeFilter === "Unread") return c.unread > 0;
        return c.category === activeFilter;
      });

      chatListEl.innerHTML = "";
      filtered.forEach((c) => {
        const history = chatHistories[c.id];
        const lastMsg = history[history.length - 1];

        const row = document.createElement("div");
        row.className = "chat-row";
        row.innerHTML = `
          <div class="avatar">${c.avatarSVG}</div>
          <div class="chat-row-body">
            <div class="chat-row-top">
              <div class="chat-row-name">
                <span>${c.name}</span>
                <svg class="verified-icon" viewBox="0 0 24 24">
                  <path d="M12 2L14.8 4.4L18.5 4.1L19.6 7.6L22.7 9.6L21.6 13.1L22.7 16.6L19.6 18.6L18.5 22.1L14.8 21.8L12 24.2L9.2 21.8L5.5 22.1L4.4 18.6L1.3 16.6L2.4 13.1L1.3 9.6L4.4 7.6L5.5 4.1L9.2 4.4L12 2ZM10.4 16.3L17.1 9.6L15.7 8.2L10.4 13.5L8.1 11.2L6.7 12.6L10.4 16.3Z"/>
                </svg>
              </div>
              <span class="chat-row-time ${c.unread > 0 ? "has-unread" : ""}">${lastMsg.time}</span>
            </div>
            <div class="chat-row-bottom">
              <div class="chat-row-preview">${lastMsg.sender === "outgoing" ? "You: " : ""}${lastMsg.text}</div>
              ${
                c.unread > 0
                  ? `<span class="unread-badge">${c.unread}</span>`
                  : c.pinned
                  ? `<span class="pin-icon">📌</span>`
                  : ""
              }
            </div>
          </div>
        `;
        row.addEventListener("click", () => openCharacterChat(c.id));
        chatListEl.appendChild(row);
      });
    }

    // Open Specific Character Chat
    function openCharacterChat(charId) {
      activeChar = CHARACTERS.find((c) => c.id === charId);
      if (!activeChar) return;

      activeChar.unread = 0;
      renderChatList();

      chatHeaderAvatar.innerHTML = activeChar.avatarSVG;
      chatHeaderName.textContent = activeChar.name;
      chatHeaderStatus.textContent = activeChar.status;
      chatHeaderStatus.classList.remove("typing");

      // Render stored messages
      messagesArea.innerHTML = `
        <div class="date-pill">Today</div>
        <div class="system-banner">
          ⚡ Secured by Stark Industries Quantum-AES Encryption via J.A.R.V.I.S. Relay.
        </div>
      `;

      chatHistories[activeChar.id].forEach((m) => {
        appendBubbleDOM(m.text, m.sender, m.time, "read");
      });

      // Render character-specific quick chips
      quickReplies.innerHTML = "";
      activeChar.chips.forEach((chip) => {
        const btn = document.createElement("button");
        btn.className = "chip";
        btn.textContent = chip.label;
        btn.addEventListener("click", () => sendMessage(chip.msg));
        quickReplies.appendChild(btn);
      });

      homeView.classList.add("hidden-left");
      chatView.classList.remove("hidden-right");
    }

    function closeCharacterChat() {
      if (isReplying) return;
      chatView.classList.add("hidden-right");
      homeView.classList.remove("hidden-left");
      activeChar = null;
      renderChatList();
    }

    function appendBubbleDOM(text, sender, time, tickState = "sent") {
      const row = document.createElement("div");
      row.className = `message-row ${sender}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const spanText = document.createElement("span");
      spanText.textContent = text;

      const meta = document.createElement("span");
      meta.className = "msg-meta";
      meta.innerHTML = `<span>${time}</span>${
        sender === "outgoing" ? `<span class="ticks">${getTickSVG(tickState)}</span>` : ""
      }`;

      bubble.appendChild(spanText);
      bubble.appendChild(meta);
      row.appendChild(bubble);
      messagesArea.appendChild(row);
      messagesArea.scrollTop = messagesArea.scrollHeight;
      return row;
    }

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    async function sendMessage(customText = null) {
      if (!activeChar || isReplying) return;
      const text = (customText ?? messageInput.value).trim();
      if (!text) return;

      isReplying = true;
      if (!customText) {
        messageInput.value = "";
        messageInput.style.height = "auto";
      }

      const time = getTimeNow();
      const currentTarget = activeChar;
      chatHistories[currentTarget.id].push({ sender: "outgoing", text, time });

      const row = appendBubbleDOM(text, "outgoing", time, "sent");

      await sleep(320);
      row.querySelector(".ticks").innerHTML = getTickSVG("delivered");

      await sleep(480);
      row.querySelector(".ticks").innerHTML = getTickSVG("read");

      chatHeaderStatus.textContent = "typing...";
      chatHeaderStatus.classList.add("typing");

      const typingRow = document.createElement("div");
      typingRow.className = "message-row incoming";
      typingRow.innerHTML = `<div class="bubble typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
      messagesArea.appendChild(typingRow);
      messagesArea.scrollTop = messagesArea.scrollHeight;

      await sleep(950);

      typingRow.remove();
      chatHeaderStatus.textContent = currentTarget.status;
      chatHeaderStatus.classList.remove("typing");

      const replyText = currentTarget.getReply(text);
      const replyTime = getTimeNow();
      chatHistories[currentTarget.id].push({
        sender: "incoming",
        text: replyText,
        time: replyTime
      });

      appendBubbleDOM(replyText, "incoming", replyTime);
      isReplying = false;
    }

    // Event Listeners
    backToHomeBtn.addEventListener("click", closeCharacterChat);

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderChatList();
    });

    filterBar.addEventListener("click", (e) => {
      const pill = e.target.closest(".filter-pill");
      if (!pill) return;
      document.querySelectorAll(".filter-pill").forEach((p) => p.classList.remove("active"));
      pill.classList.add("active");
      activeFilter = pill.getAttribute("data-filter");
      renderChatList();
    });

    messageInput.addEventListener("input", () => {
      messageInput.style.height = "auto";
      messageInput.style.height = Math.min(messageInput.scrollHeight, 96) + "px";
    });

    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener("click", () => sendMessage());

    resetChatBtn.addEventListener("click", () => {
      if (!activeChar || isReplying) return;
      chatHistories[activeChar.id] = [
        { sender: "incoming", text: activeChar.openingLine, time: getTimeNow() }
      ];
      openCharacterChat(activeChar.id);
    });

    openProfileBtn.addEventListener("click", () => {
      if (!activeChar) return;
      document.getElementById("modalAvatar").innerHTML = activeChar.avatarSVG;
      document.getElementById("modalName").textContent = activeChar.name;
      document.getElementById("modalHandle").textContent = activeChar.handle;
      document.getElementById("modalBio").innerHTML = `<strong>J.A.R.V.I.S. Dossier:</strong><br/>${activeChar.bio}`;
      profileModal.classList.add("open");
    });

    closeModalBtn.addEventListener("click", () => profileModal.classList.remove("open"));
    profileModal.addEventListener("click", (e) => {
      if (e.target === profileModal) profileModal.classList.remove("open");
    });

    document.getElementById("updatesTabBtn").addEventListener("click", () => {
      alert("J.A.R.V.I.S. HUD Status: All 5 Multiverse Comms Channels Online.");
    });

    // Initial render
    renderChatList();
  </script>
</body>
</html>
